<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timur Chahovets</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
    }
    img.logo {
      height: 40px;
      display: block;
      margin-bottom: 30px;
    }
    img.photo {
      display: block;
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: center 55%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid black;
      padding: 2px 4px;
      text-align: left;
    }
    th {
      background-color: #e97f33;
      text-align: center;
    }
    td.cas {
      font-weight: bold;
    }
    td.zvyraznene {
      background-color: #fff2cc;
    }
    td.stred {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Technická univerzita v Košiciach">

  <h1>Timur Chahovets</h1>
  <p>Študent komerčnej logistiky.</p>

  <img class="photo" src="photo.jpg" alt="Timur Chahovets">

  <h2>Môj rozvrh hodín</h2>

  <table>
    <tr>
      <th>Čas / Deň</th>
      <th>Pondelok</th>
      <th>Utorok</th>
      <th>Streda</th>
    </tr>
    <tr>
      <td class="cas">8:00 - 9:30</td>
      <td>Teória logistiky</td>
      <td>Simulačné systémy</td>
      <td class="stred" rowspan="2">Tvorba webových stránok</td>
    </tr>
    <tr>
      <td class="cas">9:45 - 11:15</td>
      <td>Algoritmizácia</td>
      <td>Matematika</td>
    </tr>
    <tr>
      <td class="cas">13:30 - 15:00</td>
      <td class="zvyraznene">Technológie internetu</td>
      <td>Ekonomika</td>
      <td>Telesná výchova</td>
    </tr>
  </table>

  <p><a href="https://maisportal.tuke.sk/portal/rozvrhy.mais" target="_blank" rel="noopener">otvoriť v MAISe</a></p>

</html>
